name: intent-driven-engineering
version: 1
description: >-
  Intent-driven OpenSpec workflow with engineering discipline guidance -
  proposal -> Gherkin-style specs -> design -> adr -> tasks, with domain
  modeling, research, codebase design, TDD, bug diagnosis, and code review
  applied where each phase needs it
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: >
      Create the proposal document that establishes WHY this change is needed.

      Sections:

      - **Why**: 1-2 sentences on the problem or opportunity. What problem does
      this solve? Why now?

      - **What Changes**: Bullet list of changes. Be specific about new
      capabilities, modifications, or removals. Mark breaking changes with
      **BREAKING**.

      - **Capabilities**: Identify which behaviour specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<name>/spec.md`. Use kebab-case names (e.g., `user-auth`, `data-export`).
        - **Modified Capabilities**: List existing capabilities whose behaviour is changing. Only include if spec-level behaviour changes, not just implementation details. Each needs an OpenSpec Markdown delta file at `specs/<name>/spec.md`. Check `openspec/specs/` for existing spec names. Leave empty if no behaviour changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      IMPORTANT: The Capabilities section is critical. It creates the contract
      between proposal and specs phases. Research existing specs before filling
      this in. Each capability listed here will need a corresponding spec file.

      Durable architectural decisions worth carrying across changes are
      distilled into ADR files at <repo>/adr/ by a later step after design.

      Keep it concise (1-2 pages). Focus on the "why" not the "how" -
      implementation details belong in design.md.

      This is the foundation - specs, design, adr, and tasks all build on this.

      Domain terms (skill: domain-modeling): while writing this proposal, challenge
      and sharpen the vocabulary the change depends on. When a term is fuzzy,
      overloaded, or conflicts with existing usage, resolve it to one canonical
      term and record it in the proposal's Domain Terms section with a short
      definition. Stress-test boundaries with concrete edge-case scenarios before
      committing to a capability split. The proposal template provides the
      Domain Terms section.

      External research (skill: research, conditional): if the proposal depends on
      an unresolved external fact - protocol, library, or API behaviour that
      cannot be settled from this repository - research it from authoritative
      sources before finalizing, and record the finding with its citation in the
      proposal's External Research section. Omit the section when no external
      research was required. Do not use this step for facts the codebase already
      answers.

      Material decision ambiguity (skill: grilling, conditional): when the
      proposal depends on product or design decisions that repository evidence
      cannot resolve, map the decisions as a tree and ask the user every
      currently unblocked question in one round, with a recommended answer for
      each. Recompute the frontier after each response. Do not create planning
      artifacts that assume unsettled user decisions; omit this step when no
      material decision remains.

      Durable architectural decisions worth carrying across changes are
      distilled into ADR files at <repo>/adr/ by a later step after design.
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: Detailed specifications for the change
    template: spec.md
    instruction: >
      Create specification files that define WHAT the system should do.
      Use CLI changeRoot, artifactPaths, resolvedOutputPath, and dependency paths
      from status/instructions as authority. All generates paths are relative
      to changeRoot, not the working directory. specs/**/*.md is a glob:
      write non-empty <changeRoot>/specs/<capability>/spec.md for each capability.
      Never write a literal glob path or count an empty directory as completion.
      Read concrete dependency files; verify existingOutputPaths and refreshed
      status after writing. Missing metadata or conflicting paths are blockers.

      Create one spec file per capability listed in the proposal's Capabilities
      section.

      - New capabilities: use the exact kebab-case name from the proposal
      (specs/<capability>/spec.md).

      - Modified capabilities: use the existing spec folder name from
      openspec/specs/<capability>/ when creating the delta spec at
      specs/<capability>/spec.md.

      Delta operations (use ## headers):

      - **ADDED Requirements**: New capabilities

      - **MODIFIED Requirements**: Changed behavior - MUST include full updated
      content

      - **REMOVED Requirements**: Deprecated features - MUST include **Reason**
      and **Migration**

      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:

      - Each requirement: `### Requirement: <name>` followed by description

      - Use SHALL/MUST for normative requirements (avoid should/may)

      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format

      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3
      hashtags or bullets will fail silently.

      - Every requirement MUST have at least one scenario.

      MODIFIED requirements workflow:

      1. Locate the existing requirement in openspec/specs/<capability>/spec.md

      2. Copy the ENTIRE requirement block (from `### Requirement:` through all
      scenarios)

      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior

      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at
      archive time.

      If adding new concerns without changing existing behavior, use ADDED
      instead.

      Example:

      ```

      ## ADDED Requirements

      ### Requirement: User can export data

      The system SHALL allow users to export their data in CSV format.

      #### Scenario: Successful export

      - **WHEN** user clicks "Export" button

      - **THEN** system downloads a CSV file with all user data

      ## REMOVED Requirements

      ### Requirement: Legacy export

      **Reason**: Replaced by new export system

      **Migration**: Use new export endpoint at /api/v2/export

      ```

      Specs should be testable - each scenario is a potential test case.

      Authoring discipline (skills: gherkin-authoring, glossary): write every
      requirement and scenario in the Gherkin style described by
      gherkin-authoring, and reuse the exact canonical terms established in the
      proposal's Domain Terms section; if new terms crystallize while writing
      specs, add them to the proposal's Domain Terms section before continuing.
      Specs are glossary consumers, not a second glossary.

      Executable specs (skills: spec-as-source, acceptance-test-authoring,
      optional): these companions are declared but opt-in. Adopt them only when
      the specs must run as acceptance tests; when active they override the
      spec.md and tasks.md templates with their own references. Use this schema
      alone when artifact discipline without a test harness is enough.
    requires:
      - proposal
  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: >
      Create the design document that explains HOW to implement the change.

      When to include design.md (create only if any apply):

      - Cross-cutting change (multiple services/modules) or new architectural
      pattern

      - New external dependency or significant data model changes

      - Security, performance, or migration complexity

      - Ambiguity that benefits from technical decisions before coding

      Prior decisions (read existing ADRs first):

      Before writing, list every file in <repo>/adr/. Build the supersession
      graph from each ADR's Supersedes field - an ADR is no longer in force if
      a later ADR's Supersedes points at it. Only the currently-in-force ADRs
      (accepted, not superseded) constrain this design. Older superseded ADRs
      are historical context only and MUST NOT be treated as live commitments.
      New design choices MUST be coherent with the in-force set. If a current
      ADR needs to be revisited, do not propose modifying it; flag it under
      Open Questions and let the adr step record a new superseding ADR.

      Sections:

      - **Context**: Background, current state, constraints, stakeholders

      - **Goals / Non-Goals**: What this design achieves and explicitly excludes

      - **Decisions**: Key technical choices with rationale (why X over Y?).
      Include alternatives considered for each decision.

      - **Risks / Trade-offs**: Known limitations, things that could go wrong.
      Format: [Risk] -> Mitigation

      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)

      - **Open Questions**: Outstanding decisions or unknowns to resolve.
      Include any in-force ADRs that this design suggests revisiting; the adr
      step will record the supersession.

      Focus on architecture and approach, not line-by-line implementation.

      Reference the proposal for motivation and specs for requirements.

      Good design docs explain the "why" behind technical decisions.

      Design discipline (skills: codebase-design, c4-diagrams): evaluate each
      candidate module against its Interface - everything a caller must know to
      use it correctly (invariants, ordering constraints, error modes, required
      configuration, performance characteristics - not just the type signature).
      Record where the change introduces or moves a seam: the boundary where
      behavior is injected, swapped, or faked for tests. Prefer deep modules
      that hide complexity behind simple interfaces, and keep related behavior
      local so callers are not dragged across the codebase. Where structure is
      hard to state in prose, add a C4-style diagram (ASCII or Mermaid) with
      c4-diagrams.

      Prototype (skill: prototype, optional): only when a material UI or state
      question cannot be settled from existing evidence, build a throwaway
      prototype to answer it. Skip polish, tests, and abstractions - the point
      is to learn fast. Discard the prototype afterward and record only the
      finding in design.md. Never ship prototype code as the implementation.

      Keep ADR-worthy decisions minimal: propose durable ADRs only for choices
      that are hard to reverse, surprising without context, and the result of a
      real trade-off; the adr step reviews and records them.
    requires:
      - proposal
  - id: adr
    generates: adr.md
    description: Per-change ADR review manifest and durable decision handoff
    template: adr.md
    instruction: >
      Complete ADR review for this change by writing a concise manifest at
      <changeRoot>/adr.md, using CLI resolvedOutputPath. This change-local file is the artifact
      completion marker for the adr step. Existing files under <repo>/adr/ are
      required context for the review, but they MUST NOT satisfy completion for
      a new change.

      If the change introduces a major durable architectural decision, also
      create an Architecture Decision Record under <repo>/adr/. The path
      <repo>/adr/ means the target repository's top-level adr/ folder beside
      openspec/, not any folder inside openspec/. Repository-level ADR files
      persist across changes and MUST be written outside openspec/.

      IRON RULE - ADRs are immutable once accepted. You MUST NOT edit a prior
      ADR file under any circumstance, not its Status, not its body, not its
      date. To change a previously accepted decision, record a NEW ADR whose
      Status is "accepted, supersedes ADR-NNNN" and whose `Supersedes:` field
      names the prior one. Design consumers derive what is currently in force
      by walking Supersedes links across the folder. The prior ADR's contents
      stay frozen as a historical record.

      Process:

      1. Read every existing ADR in <repo>/adr/. Build the supersession graph
      from each ADR's Supersedes field. Note the highest sequence number in
      use.

      2. Re-read design.md. Identify decisions that meet ALL of these:

      - Establish a long-term architectural commitment (pattern, technology,
      boundary, contract) - not a tactical implementation detail.

      - Will affect future changes beyond this one.

      - Either aren't already captured by a currently-in-force ADR, OR
      intentionally diverge from one. If diverging, the new ADR supersedes the
      prior.

      3. For each qualifying decision, create a NEW repository-level file at
      <repo>/adr/NNNN-kebab-title.md, where NNNN is a 4-digit sequence one
      greater than the highest existing. Include title, Status, Date, optional
      Supersedes, and MADR-short sections: Context, Decision, and
      Consequences. If this decision replaces a prior in-force ADR, set Status to
      "accepted, supersedes ADR-NNNN", populate the `Supersedes:` field, and
      explain in Context why the prior decision is being revisited. Do NOT
      touch the prior ADR's file.

      4. Write <changeRoot>/adr.md at CLI resolvedOutputPath using the template. The manifest
      MUST state that ADR review completed for this change, list the in-force
      ADR context reviewed, and reference every repository-level ADR file
      created for this change. It MUST NOT duplicate full Context, Decision, or
      Consequences content from repository-level ADR files.

      5. If nothing meets the bar, do not invent ADRs. The manifest MUST
      explicitly state that no major durable architectural decisions were
      introduced and no new repository-level ADR files were created.

      Filename convention: NNNN-kebab-title.md (e.g.,
      0042-use-postgres-for-catalog.md). Sequence is monotonic across the
      whole repo and never reused.
    requires:
      - design
  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: >
      Create the task list that breaks down the implementation work.

      **IMPORTANT: Follow the template below exactly.** The apply phase parses
      checkbox format to track progress. Tasks not using `- [ ]` won't be
      tracked.

      Guidelines:

      - Group related tasks under ## numbered headings.

      - Each task MUST be a checkbox: `- [ ] X.Y Task description`.

      - Tasks should be small enough to complete in one session.

      - Order tasks by dependency (what must be done first?).

      - If implementation changes behaviour specs, include a task to run
      `openspec validate <change> --type change --strict` before archive.

      Reference specs for what to build, design for how to build it, and
      <repo>/adr/ for durable architectural commitments to honor.

      Each task should be verifiable - you know when it's done.

      Vertical, verifiable slices: organize tasks as vertical slices that each
      deliver a coherent end-to-end, user- or API-observable piece - a slice
      includes its wiring and its verification, never a horizontal layer such
      as "add all types" or "wire everything". Order slices by dependency.
      Every task names its own verification: the targeted check (specific
      test, repro, or command) whose passing proves the task done. Do not
      create tracker-specific tickets; the checkbox list is the tracker.
    requires:
      - specs
      - adr
apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Read context files, work through pending tasks, mark complete as you go.
    Pause if you hit blockers or need clarification.

    Choose the discipline for each task before implementing it:

    - Reported bug (skill: diagnosing-bugs): first produce a tight, binary
      pass/fail reproduction that fails on exactly this bug; then use
      bisection, hypothesis testing, or instrumentation to find the cause, fix
      it, and confirm the reproduction passes. Never fix from staring at code
      alone.

    - New behavior (skill: tdd): test only at seams named in the design.
      Confirm each seam before writing its tests; write the failing test for
      the defined behavior, make it pass with the smallest correct change, and
      refactor with the suite green. Do not test unconfirmed seams.

    - Neither applies: implement directly against the design.

    After implementation, verify in order before marking any task complete:

    1. Targeted verification: run the verification named on each completed
       task and confirm it passes.

    2. Change validation: when the change has behavior specs, run
       `openspec validate <change> --type change --strict`.

    3. Schema validation: when this change modifies intent-driven-engineering
       schema files, run `openspec schema validate intent-driven-engineering`.

    4. Code review (skill: code-review): review the implementation against
       these change artifacts (proposal, specs, design, adr.md, tasks.md) and
       the repository's local standards. Check that behavior matches the
       specs, design decisions and seams were honored, and nothing outside the
       change's scope was altered. Address findings before completion.

    A task checkbox is marked complete only after its verification passes.
    Completion requires all tasks checked, verification and the reviews above
    done, and no unaddressed findings.
